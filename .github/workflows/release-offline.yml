name: Build Offline Windows Package

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - run: npm run build:client
      - run: npm test
      - name: Build self-contained offline ZIP
        shell: pwsh
        run: ./tools/release/build-offline-windows.ps1 -OutputDir "$env:RUNNER_TEMP\scoreboard-release"
      - uses: actions/upload-artifact@v4
        with:
          name: robot-scoreboard-windows-x64
          path: ${{ runner.temp }}\scoreboard-release\robot-scoreboard-windows-x64.zip
          if-no-files-found: error
          retention-days: 30
