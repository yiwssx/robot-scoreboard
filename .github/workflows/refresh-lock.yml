name: Refresh dependency lock

on:
  push:
    branches: ["agent/re-engineering-hardening"]
    paths: [".github/workflows/refresh-lock.yml"]

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/re-engineering-hardening
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - name: Regenerate lockfile from declared ranges
        run: |
          rm package-lock.json
          npm install --package-lock-only --ignore-scripts
      - name: Commit regenerated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "regenerate secure dependency lockfile"
          git push origin HEAD:agent/re-engineering-hardening
