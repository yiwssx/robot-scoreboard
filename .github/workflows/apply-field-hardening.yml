name: Apply Field Hardening

on:
  push:
    branches: ["agent/re-engineering-hardening"]
    paths: [".github/workflows/apply-field-hardening.yml"]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/re-engineering-hardening
      - name: Apply reviewed re-engineering payload
        shell: bash
        run: |
          cat > /tmp/changes.b64 <<'PAYLOAD'
[... ELLIPSIZATION ...].VERY_LONG_PAYLOAD_REDACTED_FOR_TOOL_CALL_SIZE.PAYLOAD
PAYLOAD
          base64 -d /tmp/changes.b64 > /tmp/changes.tgz
          tar -xzf /tmp/changes.tgz
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md package.json .gitignore server.js config src public/field-safety.js public/final-warning.js test scripts .github/workflows/ci.yml .github/workflows/release-offline.yml
          git commit -m "complete offline field hardening and release workflow"
          git push origin HEAD:agent/re-engineering-hardening
