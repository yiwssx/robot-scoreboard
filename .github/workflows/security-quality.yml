name: Security Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 20 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL
    if: github.event_name != 'pull_request' || github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      packages: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:javascript-typescript"
          output: codeql-results
      - name: Upload SARIF diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: codeql-sarif-${{ github.run_id }}
          path: codeql-results/*.sarif
          if-no-files-found: error
          retention-days: 1

  dependency-audit-diagnostics:
    name: Dependency audit diagnostics
    if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - name: Export npm audit JSON
        shell: bash
        run: npm audit --json > npm-audit.json || true
      - name: Upload npm audit diagnostics
        uses: actions/upload-artifact@v7
        with:
          name: npm-audit-${{ github.run_id }}
          path: npm-audit.json
          if-no-files-found: error
          retention-days: 1
