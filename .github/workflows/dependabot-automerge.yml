name: Dependabot Auto Merge

on:
  workflow_run:
    workflows: ["CI", "Security Quality"]
    types: [completed]

permissions:
  actions: read
  contents: write
  pull-requests: write

jobs:
  merge:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Merge safe dependency update after exact-head CI and CodeQL success
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          case "$HEAD_BRANCH" in
            dependabot/*) ;;
            *) echo "Not a Dependabot branch; nothing to do."; exit 0 ;;
          esac

          OWNER="${GITHUB_REPOSITORY%%/*}"
          PR_JSON="$(gh api --method GET "repos/$GITHUB_REPOSITORY/pulls" \
            -f state='open' -f head="$OWNER:$HEAD_BRANCH")"
          PR_COUNT="$(jq 'length' <<<"$PR_JSON")"
          if [ "$PR_COUNT" -ne 1 ]; then
            echo "Expected one open PR for $HEAD_BRANCH, found $PR_COUNT; skipping."
            exit 0
          fi

          PR_NUMBER="$(jq -r '.[0].number' <<<"$PR_JSON")"
          PR_USER="$(jq -r '.[0].user.login' <<<"$PR_JSON")"
          PR_HEAD_SHA="$(jq -r '.[0].head.sha' <<<"$PR_JSON")"
          PR_BASE="$(jq -r '.[0].base.ref' <<<"$PR_JSON")"

          if [ "$PR_USER" != 'dependabot[bot]' ]; then
            echo "PR #$PR_NUMBER is not owned by Dependabot; skipping."
            exit 0
          fi
          if [ "$PR_BASE" != 'main' ]; then
            echo "PR #$PR_NUMBER does not target main; skipping."
            exit 0
          fi
          if [ "$PR_HEAD_SHA" != "$HEAD_SHA" ]; then
            echo "CI result is stale for PR #$PR_NUMBER; current head differs."
            exit 0
          fi

          LABELS="$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER" --jq '[.labels[].name]')"
          if ! jq -e 'index("dependency-direct") != null or index("dependency-security") != null' <<<"$LABELS" >/dev/null; then
            echo "PR #$PR_NUMBER is neither a confirmed direct update nor a security exception; automatic merge is forbidden."
            exit 0
          fi
          if ! jq -e 'index("automerge-safe") != null' <<<"$LABELS" >/dev/null; then
            echo "PR #$PR_NUMBER is not marked automerge-safe; manual review required."
            exit 0
          fi
          if jq -e 'index("dependency-indirect-blocked") != null' <<<"$LABELS" >/dev/null; then
            echo "PR #$PR_NUMBER is a blocked indirect/transitive update; automatic merge is forbidden."
            exit 0
          fi
          if jq -e 'index("dependency-policy-blocked") != null' <<<"$LABELS" >/dev/null; then
            echo "PR #$PR_NUMBER is outside dependency policy; automatic merge is forbidden."
            exit 0
          fi
          if jq -e 'index("dependency-hold") != null' <<<"$LABELS" >/dev/null; then
            echo "PR #$PR_NUMBER is on dependency-hold; automatic merge is paused."
            exit 0
          fi

          # CI and Security Quality are independent workflows and can finish in any order.
          # Never merge based on one successful run or results from an older PR head.
          for WORKFLOW in ci.yml security-quality.yml; do
            RUNS="$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/$WORKFLOW/runs" \
              -f event='pull_request' -f head_sha="$HEAD_SHA" -f per_page='100')"
            EXACT_RUN="$(jq -c --arg sha "$HEAD_SHA" --arg branch "$HEAD_BRANCH" \
              '[.workflow_runs[] | select(.event == "pull_request" and .head_sha == $sha and .head_branch == $branch)] | sort_by(.run_number, .run_attempt) | last // empty' \
              <<<"$RUNS")"
            if [ -z "$EXACT_RUN" ]; then
              echo "No $WORKFLOW run on the current PR head $HEAD_SHA; skipping auto-merge."
              exit 0
            fi

            RUN_STATUS="$(jq -r '.status' <<<"$EXACT_RUN")"
            RUN_CONCLUSION="$(jq -r '.conclusion' <<<"$EXACT_RUN")"
            if [ "$RUN_STATUS" != 'completed' ] || [ "$RUN_CONCLUSION" != 'success' ]; then
              echo "$WORKFLOW is $RUN_STATUS/$RUN_CONCLUSION for $HEAD_SHA; skipping auto-merge."
              exit 0
            fi
          done

          echo "CI and CodeQL passed on exact head $HEAD_SHA; merging eligible Dependabot PR #$PR_NUMBER."
          RESULT="$(gh api --method PUT "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/merge" \
            -f merge_method='merge' -f sha="$HEAD_SHA")"
          if [ "$(jq -r '.merged' <<<"$RESULT")" != 'true' ]; then
            echo "$RESULT"
            exit 1
          fi
          echo "Dependabot PR #$PR_NUMBER merged successfully."
