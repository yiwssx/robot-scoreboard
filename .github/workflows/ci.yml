name: CI

on:
  push:
    branches: [main, "agent/**"]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  refactor-public:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/architecture-refactor
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - name: Refactor public pages and assets once
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f scripts/refactor-public.js ]; then
            echo "Public refactor already applied."
            exit 0
          fi
          node scripts/refactor-public.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/refactor-public.js
          git add public
          git commit -m "organize public pages and assets"
          git push origin HEAD:agent/architecture-refactor

  linux-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm audit --audit-level=high

  windows-field-validation:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run stress:obs
      - run: npm run build:offline:windows
      - run: npm audit --audit-level=high
