name: CI

on:
  push:
    branches: [main, "agent/**"]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-event-log-flush:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/re-engineering-hardening
      - name: Make forcePersist wait for event log
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('src/scoreboard.js')
          s = p.read_text()
          old = '''  async function forcePersist() {\n    persist(true);\n    await persistence.flushAll();\n  }'''
          new = '''  async function forcePersist() {\n    persist(true);\n    await Promise.all([persistence.flushAll(), eventLog.flush()]);\n  }'''
          if old not in s:
              raise SystemExit('target forcePersist block not found')
          p.write_text(s.replace(old, new))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/scoreboard.js
          git commit -m "flush event log during force persist"
          git push origin HEAD:agent/re-engineering-hardening

  linux-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm audit --audit-level=high

  windows-field-validation:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run stress:obs
      - run: npm run build:offline:windows
      - run: npm audit --audit-level=high
