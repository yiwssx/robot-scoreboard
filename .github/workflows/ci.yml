name: CI

on:
  push:
    branches: [main, "agent/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  linux-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm audit --audit-level=high

  windows-field-validation:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run stress:obs
      - run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/test-backup-restore.ps1
      - run: npm run build:offline:windows
      - run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/verify-offline-package.ps1
      - run: npm audit --audit-level=high
